name: Daily Scrape webR Cities (Matsumoto/Shiojiri)

# webR系(富士通)公共施設予約システムの空き状況を日次取得 (松本市・塩尻市)。
# 長野市(scrape.yml)とは別ワークフロー:
#   - webRは ASP.NET WebForms の __doPostBack 遷移が必須 → Playwright を使用
#   - 共通コア scraper/webr_core.py を各市の薄いラッパが呼ぶ構成
#   - スケジュールを 30分ずらして自治体サーバ・GitHub Actions の負荷を分散
on:
  schedule:
    # 毎日 JST 03:00 (UTC 18:00)。長野市(02:30)の後ろにずらす
    - cron: '0 18 * * *'
  # 手動実行も可能
  workflow_dispatch:
    inputs:
      limit:
        description: '処理施設数の上限 (空欄=全件)'
        required: false
        default: ''
        type: string

jobs:
  scrape-matsumoto:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # webR5市計約54施設(コート別=部屋ごと遷移)。単純施設~15s/複合~50s + Playwright install。余裕を持って60分

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements-actions-matsumoto.txt'

      - name: Install dependencies
        working-directory: ./scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-actions-matsumoto.txt

      - name: Install Playwright Chromium
        working-directory: ./scraper
        run: |
          python -m playwright install --with-deps chromium

      - name: Verify environment
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
        run: |
          python --version
          echo "--- pip list (主要のみ) ---"
          pip list | grep -E "(httpx|beautifulsoup|lxml|rich|python-dotenv|playwright)" || true
          echo "--- 環境変数の有無 (値はマスク) ---"
          python -c "import os; \
            url = os.getenv('SUPABASE_URL', ''); \
            key = os.getenv('SUPABASE_SERVICE_ROLE_KEY', ''); \
            contact = os.getenv('SCRAPER_CONTACT', ''); \
            print(f'SUPABASE_URL set: {bool(url)} starts_with_https: {url.startswith(\"https://\")}'); \
            print(f'SUPABASE_SERVICE_ROLE_KEY set: {bool(key)} len: {len(key)}'); \
            print(f'SCRAPER_CONTACT set: {bool(contact)} len: {len(contact)}')"

      - name: Run Matsumoto scrape (時間帯別 / 統一コア)
        working-directory: ./scraper
        env:
          # 公開設定
          SCRAPER_NAME: NaganoSportsFinder
          SCRAPER_VERSION: '0.1.0'
          # GitHub Secrets から注入
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          LIMIT_ARG=""
          if [ -n "${{ inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ inputs.limit }}"
            echo "上限指定: ${{ inputs.limit }} 施設"
          fi
          # 時間帯別モード: 公式と同じ時間帯バケットで取得 (webr_core 統一パス)
          python webr_scrape.py --city matsumoto --timeband $LIMIT_ARG

      - name: Run Shiojiri scrape (時間帯別)
        working-directory: ./scraper
        env:
          SCRAPER_NAME: NaganoSportsFinder
          SCRAPER_VERSION: '0.1.0'
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python shiojiri/scrape.py --timeband

      - name: Run Chino/Suwa/Okaya scrape (時間帯別)
        working-directory: ./scraper
        env:
          SCRAPER_NAME: NaganoSportsFinder
          SCRAPER_VERSION: '0.1.0'
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for c in chino suwa okaya; do
            echo "=== $c ==="
            python webr_scrape.py --city $c --timeband
          done

      - name: Summary
        if: always()
        run: |
          echo "::notice::webR系5市(松本・塩尻・茅野・諏訪・岡谷)スクレイプ完了 / 結果は Supabase の availability_current で確認可"
