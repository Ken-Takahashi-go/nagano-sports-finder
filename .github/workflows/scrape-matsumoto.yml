name: Daily Scrape Matsumoto (webR)

# 松本市公共施設予約システム(webR)の空き状況を日次取得。
# 長野市(scrape.yml)とは別ワークフロー:
#   - 松本市は ASP.NET WebForms の __doPostBack 遷移が必須 → Playwright を使用
#   - スケジュールを 30分ずらして自治体サーバ・GitHub Actions の負荷を分散
on:
  schedule:
    # 毎日 JST 03:00 (UTC 18:00)。長野市(02:30)の後ろにずらす
    - cron: '0 18 * * *'
  # 手動実行も可能
  workflow_dispatch:
    inputs:
      limit:
        description: '処理施設数の上限 (空欄=全件)'
        required: false
        default: ''
        type: string

jobs:
  scrape-matsumoto:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 10施設で約3分。Playwright install 含め余裕を持って30分

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements-actions-matsumoto.txt'

      - name: Install dependencies
        working-directory: ./scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-actions-matsumoto.txt

      - name: Install Playwright Chromium
        working-directory: ./scraper
        run: |
          python -m playwright install --with-deps chromium

      - name: Verify environment
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
        run: |
          python --version
          echo "--- pip list (主要のみ) ---"
          pip list | grep -E "(httpx|beautifulsoup|lxml|rich|python-dotenv|playwright)" || true
          echo "--- 環境変数の有無 (値はマスク) ---"
          python -c "import os; \
            url = os.getenv('SUPABASE_URL', ''); \
            key = os.getenv('SUPABASE_SERVICE_ROLE_KEY', ''); \
            contact = os.getenv('SCRAPER_CONTACT', ''); \
            print(f'SUPABASE_URL set: {bool(url)} starts_with_https: {url.startswith(\"https://\")}'); \
            print(f'SUPABASE_SERVICE_ROLE_KEY set: {bool(key)} len: {len(key)}'); \
            print(f'SCRAPER_CONTACT set: {bool(contact)} len: {len(contact)}')"

      - name: Run Matsumoto scrape (all linked facilities)
        working-directory: ./scraper
        env:
          # 公開設定
          SCRAPER_NAME: NaganoSportsFinder
          SCRAPER_VERSION: '0.1.0'
          # GitHub Secrets から注入
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          LIMIT_ARG=""
          if [ -n "${{ inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ inputs.limit }}"
            echo "上限指定: ${{ inputs.limit }} 施設"
          fi
          python matsumoto/stageM6_scrape_all.py $LIMIT_ARG

      - name: Summary
        if: always()
        run: |
          echo "::notice::松本市スクレイプ完了 / 結果は Supabase の availability_current で確認可"
