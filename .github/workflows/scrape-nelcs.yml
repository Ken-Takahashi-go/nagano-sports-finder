name: Daily Scrape NELCS Cities (Ina/Chikuma/Nakano/Minowa)

# NELCS系(PHP・Playwright)の空き状況を日次取得 (伊那・千曲・中野・箕輪)。
# webR/P-Kashikanとは別ワークフロー:
#   - NELCSは5段階のJS遷移を Playwright で辿る
#   - スケジュールを JST 04:30 にずらし、他ワークフローと分散
#   - 施設は施設コード(calendar_submit引数)ベースで照合
#   - 将来httpx化可能(全段階POST→HTML)だが当面Playwright
on:
  schedule:
    - cron: '30 19 * * *'   # JST 04:30 (UTC 19:30)
  workflow_dispatch:
    inputs:
      city:
        description: '対象市 (空欄=全市)'
        required: false
        default: ''
        type: string

jobs:
  scrape-nelcs:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements-actions-matsumoto.txt'

      - name: Install dependencies (Playwright含む)
        working-directory: ./scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-actions-matsumoto.txt

      - name: Install Playwright Chromium
        working-directory: ./scraper
        run: python -m playwright install --with-deps chromium

      - name: Verify environment
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python --version
          python -c "import os; print('SUPABASE set:', bool(os.getenv('SUPABASE_URL')), bool(os.getenv('SUPABASE_SERVICE_ROLE_KEY')))"

      - name: Run NELCS scrape
        working-directory: ./scraper
        env:
          SCRAPER_NAME: NaganoSportsFinder
          SCRAPER_VERSION: '0.1.0'
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ inputs.city }}" ]; then
            CITIES="${{ inputs.city }}"
          else
            CITIES="ina chikuma minowa"
          fi
          for c in $CITIES; do
            echo "===== $c ====="
            python nelcs_scrape.py --city "$c" || echo "::warning::$c のスクレイプで一部失敗"
          done

      - name: Summary
        if: always()
        run: echo "::notice::NELCS系スクレイプ完了 / 結果は Supabase の availability_current で確認可"
